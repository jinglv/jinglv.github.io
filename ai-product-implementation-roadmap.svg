    <text x="1603" y="259" font-size="21" font-weight="700" fill="#111827">平台化治理</text>
    <text x="1603" y="281" font-size="12" font-weight="600" fill="#6d28d9">MATURITY STAGE</text>
    <text x="1559" y="333" font-size="18" font-weight="700" fill="#6d28d9">Agent Platform</text>
    <circle cx="1563" cy="364" r="4" fill="#6d28d9"/>
    <text x="1577" y="369" font-size="14" fill="#4b5563">统一开发、部署与运营</text>
    <circle cx="1563" cy="394" r="4" fill="#6d28d9"/>
    <text x="1577" y="399" font-size="14" fill="#4b5563">安全、成本与能力复用</text>
    <circle cx="1563" cy="424" r="4" fill="#6d28d9"/>
    <text x="1577" y="429" font-size="14" fill="#4b5563">目标：规模化治理</text>
