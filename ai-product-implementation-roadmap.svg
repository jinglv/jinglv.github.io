  <text x="960" y="62" font-size="42" font-weight="700" text-anchor="middle" fill="#111827">AI 产品能力成熟度路线</text>
  <text x="960" y="103" font-size="21" text-anchor="middle" fill="#4b5563">从可信交互、可控行动到可评测、可治理的平台化能力</text>
  <text x="960" y="133" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="2" fill="#9ca3af">PRODUCT MATURITY · HARNESS AS FOUNDATION</text>
  <g data-stage="L1">
    <rect x="55" y="430" width="330" height="250" rx="14" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
    <rect x="55" y="430" width="330" height="66" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="55" y="478" width="330" height="18" fill="#eff6ff"/>
    <circle cx="89" cy="463" r="20" fill="#2563eb"/>
