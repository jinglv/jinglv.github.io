  <path d="M1125 422 H1145.0 V372 H1155" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M1495 372 H1515.0 V322 H1525" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="425" y="705" width="1440" height="92" rx="14" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.8"/>
  <text x="451" y="735" font-size="17" font-weight="700" fill="#6d28d9">按需选择的架构模式</text>
  <text x="451" y="765" font-size="13" fill="#6b7280">它们不是必经等级，应根据任务复杂度、上下文隔离和协作成本选择</text>
  <rect x="870" y="721" width="285" height="58" rx="10" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="886" y="746" font-size="15" font-weight="700" fill="#6d28d9">Multi-Agent</text>
  <text x="886" y="767" font-size="12" fill="#6b7280">角色分工与并行协作</text>
  <rect x="1185" y="721" width="285" height="58" rx="10" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="1201" y="746" font-size="15" font-weight="700" fill="#6d28d9">Deep Agent</text>
  <text x="1201" y="767" font-size="12" fill="#6b7280">长程任务与上下文管理</text>
  <rect x="1500" y="721" width="285" height="58" rx="10" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="1516" y="746" font-size="15" font-weight="700" fill="#6d28d9">Autonomous Agent</text>
  <text x="1516" y="767" font-size="12" fill="#6b7280">受约束的持续自主执行</text>
  <rect x="425" y="822" width="1440" height="206" rx="18" fill="#fff7ed" stroke="#f59e0b" stroke-width="2.2"/>
  <text x="451" y="858" font-size="22" font-weight="700" fill="#9a3412">Agent Harness 持续底座</text>
  <text x="742" y="857" font-size="14" fill="#7c2d12">从 L2 开始支撑 Agent 执行，并随成熟度持续增强，而不是单独的后置阶段</text>
  <rect x="451" y="882" width="250" height="66" rx="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.4"/>
  <text x="465" y="908" font-size="14" font-weight="700" fill="#9a3412">Context + State</text>
  <text x="465" y="932" font-size="12" fill="#6b7280">上下文、会话与执行状态</text>
  <rect x="728" y="882" width="250" height="66" rx="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.4"/>
  <text x="742" y="908" font-size="14" font-weight="700" fill="#9a3412">Tools + MCP</text>
  <text x="742" y="932" font-size="12" fill="#6b7280">工具连接与环境操作</text>
  <rect x="1005" y="882" width="250" height="66" rx="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.4"/>
  <text x="1019" y="908" font-size="14" font-weight="700" fill="#9a3412">Skills + Memory</text>
  <text x="1019" y="932" font-size="12" fill="#6b7280">领域能力与长期经验</text>
  <rect x="1282" y="882" width="250" height="66" rx="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.4"/>
  <text x="1296" y="908" font-size="14" font-weight="700" fill="#9a3412">Sandbox + Approval</text>
  <text x="1296" y="932" font-size="12" fill="#6b7280">权限、隔离与人工审批</text>
  <rect x="1559" y="882" width="250" height="66" rx="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.4"/>
  <text x="1573" y="908" font-size="14" font-weight="700" fill="#9a3412">Trace + Evaluation</text>
  <text x="1573" y="932" font-size="12" fill="#6b7280">全程追踪、评估与验证</text>
  <text x="451" y="985" font-size="13" font-weight="700" fill="#9a3412">实现示例</text>
  <text x="550" y="985" font-size="13" font-weight="700" fill="#374151">Claude Code / Codex</text>
  <text x="550" y="1007" font-size="11" fill="#6b7280">代码库与编码 Harness</text>
  <text x="870" y="985" font-size="13" font-weight="700" fill="#374151">DeepAgents</text>
  <text x="870" y="1007" font-size="11" fill="#6b7280">复杂业务 Agent SDK</text>
  <text x="1190" y="985" font-size="13" font-weight="700" fill="#374151">Hermes Agent</text>
  <text x="1190" y="1007" font-size="11" fill="#6b7280">持久自主个人 Agent</text>
  <text x="1510" y="985" font-size="13" font-weight="700" fill="#374151">DeepSeek Harness</text>
  <text x="1510" y="1007" font-size="11" fill="#6b7280">插件化开放 Harness</text>
  <path d="M425 812 V802 H1865 V812" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <text x="55" y="740" font-size="14" font-weight="700" fill="#374151">成熟度主线</text>
  <text x="55" y="765" font-size="13" fill="#6b7280">价值递进，而非技术堆叠</text>
  <text x="55" y="870" font-size="14" font-weight="700" fill="#374151">关键原则</text>
  <text x="55" y="897" font-size="13" fill="#6b7280">RAG 与 Tool Calling 可组合</text>
  <text x="55" y="922" font-size="13" fill="#6b7280">Evaluation 贯穿全生命周期</text>
  <text x="55" y="947" font-size="13" fill="#6b7280">复杂架构只在必要时引入</text>
  <text x="55" y="1008" font-size="11" fill="#9ca3af">成熟度衡量：可信度 → 行动力 → 可恢复 → 可审计 → 可治理</text>
</svg>
