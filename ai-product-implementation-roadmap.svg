    <text x="837" y="529" font-size="14" fill="#4b5563">目标：过程可恢复</text>
  </g>
  <g data-stage="L4">
    <rect x="1165" y="280" width="330" height="250" rx="14" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
    <rect x="1165" y="280" width="330" height="66" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <rect x="1165" y="328" width="330" height="18" fill="#f0fdfa"/>
    <circle cx="1199" cy="313" r="20" fill="#0f766e"/>
