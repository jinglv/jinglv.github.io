  <g data-stage="L5">
    <rect x="1535" y="230" width="330" height="250" rx="14" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
    <rect x="1535" y="230" width="330" height="66" rx="14" fill="#faf5ff" stroke="#6d28d9" stroke-width="2"/>
    <rect x="1535" y="278" width="330" height="18" fill="#faf5ff"/>
