    <text x="123" y="459" font-size="21" font-weight="700" fill="#111827">可信交互</text>
    <text x="123" y="481" font-size="12" font-weight="600" fill="#2563eb">MATURITY STAGE</text>
    <text x="79" y="533" font-size="18" font-weight="700" fill="#2563eb">Chat + RAG</text>
    <circle cx="83" cy="564" r="4" fill="#2563eb"/>
    <text x="97" y="569" font-size="14" fill="#4b5563">多轮对话与上下文</text>
    <circle cx="83" cy="594" r="4" fill="#2563eb"/>
    <text x="97" y="599" font-size="14" fill="#4b5563">知识检索与证据引用</text>
    <circle cx="83" cy="624" r="4" fill="#2563eb"/>
    <text x="97" y="629" font-size="14" fill="#4b5563">目标：回答可信</text>
  </g>
  <g data-stage="L2">
    <rect x="425" y="380" width="330" height="250" rx="14" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
    <rect x="425" y="380" width="330" height="66" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="425" y="428" width="330" height="18" fill="#eff6ff"/>
    <circle cx="459" cy="413" r="20" fill="#2563eb"/>
    <text x="459" y="419" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">L2</text>
    <text x="493" y="409" font-size="21" font-weight="700" fill="#111827">可控行动</text>
    <text x="493" y="431" font-size="12" font-weight="600" fill="#2563eb">MATURITY STAGE</text>
    <text x="449" y="483" font-size="18" font-weight="700" fill="#2563eb">Tool-Using Agent</text>
    <circle cx="453" cy="514" r="4" fill="#2563eb"/>
    <text x="467" y="519" font-size="14" fill="#4b5563">结构化工具调用</text>
    <circle cx="453" cy="544" r="4" fill="#2563eb"/>
