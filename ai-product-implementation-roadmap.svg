    <circle cx="453" cy="574" r="4" fill="#2563eb"/>
    <text x="467" y="579" font-size="14" fill="#4b5563">目标：行动可控</text>
  </g>
  <g data-stage="L3">
    <rect x="795" y="330" width="330" height="250" rx="14" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
    <rect x="795" y="330" width="330" height="66" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
