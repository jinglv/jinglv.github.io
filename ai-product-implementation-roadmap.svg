    <text x="1233" y="309" font-size="21" font-weight="700" fill="#111827">业务闭环</text>
    <text x="1233" y="331" font-size="12" font-weight="600" fill="#0f766e">MATURITY STAGE</text>
    <text x="1189" y="383" font-size="18" font-weight="700" fill="#0f766e">Domain Agent</text>
