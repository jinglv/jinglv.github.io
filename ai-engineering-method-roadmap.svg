<text x="960" y="62" font-size="42" fill="#071a2d" font-weight="700" text-anchor="middle" opacity="1" letter-spacing="2">AI 工程方法与开发范式路线</text>
<text x="960" y="102" font-size="22" fill="#405b72" font-weight="500" text-anchor="middle" opacity="1" letter-spacing="1">从提示与上下文管理，到可治理的智能体软件工程</text>
<text x="960" y="131" font-size="12" fill="#748da2" font-weight="600" text-anchor="middle" opacity="1" letter-spacing="2">ENGINEERING METHODS · 9 PRACTICES</text>
<rect x="52" y="158" width="442" height="792" rx="22" fill="#e9f5ff" fill-opacity=".72" stroke="#176faf" stroke-opacity=".25"/>
<rect x="52" y="158" width="442" height="63" rx="22" fill="#176faf"/><rect x="52" y="198" width="442" height="23" fill="#176faf"/>
<text x="74" y="188" font-size="21" fill="#fff" font-weight="700" text-anchor="start" opacity="1" letter-spacing="0">01  基础交互</text>
<text x="74" y="212" font-size="12" fill="#fff" font-weight="500" text-anchor="start" opacity="0.84" letter-spacing="0">Prompt Engineering</text>
<rect x="510" y="158" width="442" height="792" rx="22" fill="#eafaf5" fill-opacity=".72" stroke="#128f7d" stroke-opacity=".25"/>
<rect x="510" y="158" width="442" height="63" rx="22" fill="#128f7d"/><rect x="510" y="198" width="442" height="23" fill="#128f7d"/>
<text x="532" y="188" font-size="21" fill="#fff" font-weight="700" text-anchor="start" opacity="1" letter-spacing="0">02  上下文系统</text>
<text x="532" y="212" font-size="12" fill="#fff" font-weight="500" text-anchor="start" opacity="0.84" letter-spacing="0">Context · Tool · Memory</text>
<rect x="968" y="158" width="442" height="792" rx="22" fill="#fff3e8" fill-opacity=".72" stroke="#df7624" stroke-opacity=".25"/>
<rect x="968" y="158" width="442" height="63" rx="22" fill="#df7624"/><rect x="968" y="198" width="442" height="23" fill="#df7624"/>
<text x="990" y="188" font-size="21" fill="#fff" font-weight="700" text-anchor="start" opacity="1" letter-spacing="0">03  智能体系统</text>
<text x="990" y="212" font-size="12" fill="#fff" font-weight="500" text-anchor="start" opacity="0.84" letter-spacing="0">Agent · Harness</text>
<rect x="1426" y="158" width="442" height="792" rx="22" fill="#f4edff" fill-opacity=".72" stroke="#6832ad" stroke-opacity=".25"/>
<rect x="1426" y="158" width="442" height="63" rx="22" fill="#6832ad"/><rect x="1426" y="198" width="442" height="23" fill="#6832ad"/>
<text x="1448" y="188" font-size="21" fill="#fff" font-weight="700" text-anchor="start" opacity="1" letter-spacing="0">04  开发与交付</text>
<text x="1448" y="212" font-size="12" fill="#fff" font-weight="500" text-anchor="start" opacity="0.84" letter-spacing="0">Vibe · SDD</text>
<text x="532" y="247" font-size="12" fill="#0f7868" font-weight="600" text-anchor="start" opacity="1" letter-spacing="0">Tool 与 Memory 是 Context/Agent 的并列能力组件</text>
<text x="1448" y="910" font-size="12" fill="#5f2aa3" font-weight="600" text-anchor="start" opacity="1" letter-spacing="0">Vibe：探索原型  ·  SDD：规范化交付</text>
