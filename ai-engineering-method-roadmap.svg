<rect x="8" y="826" width="304" height="142" rx="16" fill="#fff" fill-opacity=".97" stroke="#1474b8" stroke-width="2" filter="url(#shadow)"/><rect x="8" y="826" width="8" height="142" rx="4" fill="#1474b8"/>
<text x="28" y="857" font-size="17" fill="#1474b8" font-weight="700" text-anchor="start" opacity="1" letter-spacing="0">Prompt Engineering</text>
<text x="28" y="885" font-size="16" fill="#10233d" font-weight="650" text-anchor="start" opacity="1" letter-spacing="0">提示词工程</text>
<text x="28" y="920" font-size="14" fill="#4f6577" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">设计指令、示例与输出契约，</text>
<text x="28" y="945" font-size="14" fill="#4f6577" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">建立稳定的人机交互边界。</text>
<circle cx="150" cy="778" r="27" fill="#fff" stroke="#1474b8" stroke-width="5" filter="url(#glow)"/><circle cx="150" cy="778" r="18" fill="#1474b8"/>
<text x="150" y="783" font-size="12" fill="#fff" font-weight="700" text-anchor="middle" opacity="1" letter-spacing="0">01</text>
<line x1="351" y1="655" x2="351" y2="699" stroke="#11947f" stroke-width="2.2" stroke-opacity=".68"/>
<rect x="199.0" y="513" width="304" height="142" rx="16" fill="#fff" fill-opacity=".97" stroke="#11947f" stroke-width="2" filter="url(#shadow)"/><rect x="199.0" y="513" width="8" height="142" rx="4" fill="#11947f"/>
<text x="219.0" y="544" font-size="17" fill="#11947f" font-weight="700" text-anchor="start" opacity="1" letter-spacing="0">Context Engineering</text>
<text x="219.0" y="572" font-size="16" fill="#10233d" font-weight="650" text-anchor="start" opacity="1" letter-spacing="0">上下文工程</text>
<text x="219.0" y="607" font-size="14" fill="#4f6577" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">选择、压缩并组装上下文、状态</text>
<text x="219.0" y="632" font-size="14" fill="#4f6577" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">与知识，控制信息质量。</text>
<circle cx="351" cy="723" r="27" fill="#fff" stroke="#11947f" stroke-width="5" filter="url(#glow)"/><circle cx="351" cy="723" r="18" fill="#11947f"/>
<text x="351" y="728" font-size="12" fill="#fff" font-weight="700" text-anchor="middle" opacity="1" letter-spacing="0">02</text>
<line x1="552" y1="692" x2="552" y2="716" stroke="#11947f" stroke-width="2.2" stroke-opacity=".68"/>
<rect x="400.0" y="716" width="304" height="142" rx="16" fill="#fff" fill-opacity=".97" stroke="#11947f" stroke-width="2" filter="url(#shadow)"/><rect x="400.0" y="716" width="8" height="142" rx="4" fill="#11947f"/>
<text x="420.0" y="747" font-size="17" fill="#11947f" font-weight="700" text-anchor="start" opacity="1" letter-spacing="0">Tool Engineering</text>
<text x="420.0" y="775" font-size="16" fill="#10233d" font-weight="650" text-anchor="start" opacity="1" letter-spacing="0">工具工程</text>
<text x="420.0" y="810" font-size="14" fill="#4f6577" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">设计 Schema、权限、幂等、超时</text>
<text x="420.0" y="835" font-size="14" fill="#4f6577" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">和错误恢复等工具接口。</text>
<circle cx="552" cy="668" r="27" fill="#fff" stroke="#11947f" stroke-width="5" filter="url(#glow)"/><circle cx="552" cy="668" r="18" fill="#11947f"/>
<text x="552" y="673" font-size="12" fill="#fff" font-weight="700" text-anchor="middle" opacity="1" letter-spacing="0">03</text>
<line x1="753" y1="545" x2="753" y2="589" stroke="#11947f" stroke-width="2.2" stroke-opacity=".68"/>
<rect x="601.0" y="403" width="304" height="142" rx="16" fill="#fff" fill-opacity=".97" stroke="#11947f" stroke-width="2" filter="url(#shadow)"/><rect x="601.0" y="403" width="8" height="142" rx="4" fill="#11947f"/>
<text x="621.0" y="434" font-size="17" fill="#11947f" font-weight="700" text-anchor="start" opacity="1" letter-spacing="0">Memory Engineering</text>
<text x="621.0" y="462" font-size="16" fill="#10233d" font-weight="650" text-anchor="start" opacity="1" letter-spacing="0">记忆工程</text>
<text x="621.0" y="497" font-size="14" fill="#4f6577" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">管理写入、检索、遗忘与整合，</text>
<text x="621.0" y="522" font-size="14" fill="#4f6577" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">持续评估记忆质量。</text>
<circle cx="753" cy="613" r="27" fill="#fff" stroke="#11947f" stroke-width="5" filter="url(#glow)"/><circle cx="753" cy="613" r="18" fill="#11947f"/>
<text x="753" y="618" font-size="12" fill="#fff" font-weight="700" text-anchor="middle" opacity="1" letter-spacing="0">04</text>
<line x1="954" y1="582" x2="954" y2="606" stroke="#df7626" stroke-width="2.2" stroke-opacity=".68"/>
<rect x="802.0" y="606" width="304" height="142" rx="16" fill="#fff" fill-opacity=".97" stroke="#df7626" stroke-width="2" filter="url(#shadow)"/><rect x="802.0" y="606" width="8" height="142" rx="4" fill="#df7626"/>
<text x="822.0" y="637" font-size="17" fill="#df7626" font-weight="700" text-anchor="start" opacity="1" letter-spacing="0">Agent Engineering</text>
<text x="822.0" y="665" font-size="16" fill="#10233d" font-weight="650" text-anchor="start" opacity="1" letter-spacing="0">智能体工程</text>
<text x="822.0" y="700" font-size="14" fill="#4f6577" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">组合目标、规划、工具、记忆、</text>
<text x="822.0" y="725" font-size="14" fill="#4f6577" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">安全与评估，形成执行闭环。</text>
<circle cx="954" cy="558" r="27" fill="#fff" stroke="#df7626" stroke-width="5" filter="url(#glow)"/><circle cx="954" cy="558" r="18" fill="#df7626"/>
<text x="954" y="563" font-size="12" fill="#fff" font-weight="700" text-anchor="middle" opacity="1" letter-spacing="0">05</text>
<line x1="1155" y1="435" x2="1155" y2="479" stroke="#df7626" stroke-width="2.2" stroke-opacity=".68"/>
<rect x="1003.0" y="293" width="304" height="142" rx="16" fill="#fff" fill-opacity=".97" stroke="#df7626" stroke-width="2" filter="url(#shadow)"/><rect x="1003.0" y="293" width="8" height="142" rx="4" fill="#df7626"/>
<text x="1023.0" y="324" font-size="17" fill="#df7626" font-weight="700" text-anchor="start" opacity="1" letter-spacing="0">Harness Engineering</text>
<text x="1023.0" y="352" font-size="16" fill="#10233d" font-weight="650" text-anchor="start" opacity="1" letter-spacing="0">智能体运行框架工程</text>
<text x="1023.0" y="387" font-size="14" fill="#4f6577" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">建设运行时、状态、沙箱、重试、</text>
<text x="1023.0" y="412" font-size="14" fill="#4f6577" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">追踪与人工介入机制。</text>
<circle cx="1155" cy="503" r="27" fill="#fff" stroke="#df7626" stroke-width="5" filter="url(#glow)"/><circle cx="1155" cy="503" r="18" fill="#df7626"/>
<text x="1155" y="508" font-size="12" fill="#fff" font-weight="700" text-anchor="middle" opacity="1" letter-spacing="0">06</text>
<line x1="1356" y1="472" x2="1356" y2="496" stroke="#6c36b1" stroke-width="2.2" stroke-opacity=".68"/>
<rect x="1204.0" y="496" width="304" height="142" rx="16" fill="#fff" fill-opacity=".97" stroke="#6c36b1" stroke-width="2" filter="url(#shadow)"/><rect x="1204.0" y="496" width="8" height="142" rx="4" fill="#6c36b1"/>
<text x="1224.0" y="527" font-size="17" fill="#6c36b1" font-weight="700" text-anchor="start" opacity="1" letter-spacing="0">Vibe Coding</text>
<text x="1224.0" y="555" font-size="16" fill="#10233d" font-weight="650" text-anchor="start" opacity="1" letter-spacing="0">自然语言探索式编程</text>
<text x="1224.0" y="590" font-size="14" fill="#4f6577" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">适合快速验证想法和原型；</text>
<text x="1224.0" y="615" font-size="14" fill="#4f6577" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">不等同于生产级工程保证。</text>
<circle cx="1356" cy="448" r="27" fill="#fff" stroke="#6c36b1" stroke-width="5" filter="url(#glow)"/><circle cx="1356" cy="448" r="18" fill="#6c36b1"/>
<text x="1356" y="453" font-size="12" fill="#fff" font-weight="700" text-anchor="middle" opacity="1" letter-spacing="0">07</text>
<line x1="1557" y1="325" x2="1557" y2="369" stroke="#6c36b1" stroke-width="2.2" stroke-opacity=".68"/>
<rect x="1550" y="183" width="304" height="142" rx="16" fill="#fff" fill-opacity=".97" stroke="#6c36b1" stroke-width="2" filter="url(#shadow)"/><rect x="1550" y="183" width="8" height="142" rx="4" fill="#6c36b1"/>
<text x="1570" y="214" font-size="14" fill="#6c36b1" font-weight="700" text-anchor="start" opacity="1" letter-spacing="0">Spec-Driven Development</text>
<text x="1570" y="242" font-size="16" fill="#10233d" font-weight="650" text-anchor="start" opacity="1" letter-spacing="0">规范驱动开发（SDD）</text>
<text x="1570" y="277" font-size="14" fill="#4f6577" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">以规格、契约和验收测试约束</text>
<text x="1570" y="302" font-size="14" fill="#4f6577" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">智能体，实现可审查交付。</text>
<circle cx="1557" cy="393" r="27" fill="#fff" stroke="#6c36b1" stroke-width="5" filter="url(#glow)"/><circle cx="1557" cy="393" r="18" fill="#6c36b1"/>
<text x="1557" y="398" font-size="12" fill="#fff" font-weight="700" text-anchor="middle" opacity="1" letter-spacing="0">08</text>
<line x1="1758" y1="362" x2="1758" y2="386" stroke="#6c36b1" stroke-width="2.2" stroke-opacity=".68"/>
<rect x="1606.0" y="386" width="304" height="142" rx="16" fill="#fff" fill-opacity=".97" stroke="#6c36b1" stroke-width="2" filter="url(#shadow)"/><rect x="1606.0" y="386" width="8" height="142" rx="4" fill="#6c36b1"/>
<text x="1626.0" y="417" font-size="14" fill="#6c36b1" font-weight="700" text-anchor="start" opacity="1" letter-spacing="0">Agentic Software Engineering</text>
<text x="1626.0" y="445" font-size="16" fill="#10233d" font-weight="650" text-anchor="start" opacity="1" letter-spacing="0">智能体驱动的软件工程</text>
<text x="1626.0" y="480" font-size="14" fill="#4f6577" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">智能体参与需求、编码、测试、</text>
<text x="1626.0" y="505" font-size="14" fill="#4f6577" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">评审与交付，人负责治理。</text>
<circle cx="1758" cy="338" r="27" fill="#fff" stroke="#6c36b1" stroke-width="5" filter="url(#glow)"/><circle cx="1758" cy="338" r="18" fill="#6c36b1"/>
<text x="1758" y="343" font-size="12" fill="#fff" font-weight="700" text-anchor="middle" opacity="1" letter-spacing="0">09</text>
<text x="72" y="1024" font-size="14" fill="#526b7f" font-weight="700" text-anchor="start" opacity="1" letter-spacing="0">关系说明</text>
<text x="170" y="1024" font-size="14" fill="#526b7f" font-weight="500" text-anchor="start" opacity="1" letter-spacing="0">Prompt → Context → Agent → Agentic SE 为主干；Tool、Memory、Harness 提供工程支撑。</text>
<text x="72" y="1052" font-size="12" fill="#8b5c24" font-weight="500" text-anchor="start" opacity="1" letter-spacing="0">Vibe Coding 与 SDD 是不同治理强度的开发方式，不代表绝对高低等级。</text>
</svg>